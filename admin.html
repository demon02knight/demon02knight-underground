<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>admin panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<p class="small"><a href="index.html">← underground</a></p>

<h1>admin control panel</h1>

<p id="admin-status">Checking permissions...</p>

<hr>

<h2>users</h2>
<div id="users-list"></div>

<hr>

<h2>username registry</h2>
<div id="username-list"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
  import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAyHfbHaJj4-ON0jPy1be7XLO5WUOFVRyE",
    authDomain: "demon02knight-underground.firebaseapp.com",
    projectId: "demon02knight-underground",
    storageBucket: "demon02knight-underground.firebasestorage.app",
    messagingSenderId: "446345417376",
    appId: "1:446345417376:web:0457219bc40a8b0acf2fc5"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const ADMIN_UID = "rHpRdUEU0NbRui3qxmetIjQESuk1";

  onAuthStateChanged(auth, async (user) => {
    if (!user || user.uid !== ADMIN_UID) {
      document.getElementById("admin-status").textContent = "Access denied.";
      return;
    }

    document.getElementById("admin-status").textContent = "Admin verified.";

    loadUsers();
    loadUsernames();
  });

  async function loadUsers() {
    const usersSnap = await getDocs(collection(db, "users"));
    const container = document.getElementById("users-list");
    container.innerHTML = "";

    usersSnap.forEach((docSnap) => {
      const data = docSnap.data();
      const div = document.createElement("div");

      const uidRow = document.createElement("div");
      const uidLabel = document.createElement("strong");
      uidLabel.textContent = "UID:";
      uidRow.appendChild(uidLabel);
      uidRow.appendChild(document.createTextNode(" " + docSnap.id));
      div.appendChild(uidRow);

      const nameRow = document.createElement("div");
      const nameLabel = document.createElement("strong");
      nameLabel.textContent = "Username:";
      nameRow.appendChild(nameLabel);
      nameRow.appendChild(document.createTextNode(" " + (data.displayName || "none")));
      div.appendChild(nameRow);

      const lockedRow = document.createElement("div");
      const lockedLabel = document.createElement("strong");
      lockedLabel.textContent = "Locked:";
      lockedRow.appendChild(lockedLabel);
      lockedRow.appendChild(document.createTextNode(" " + (data.locked ? "yes" : "no")));
      div.appendChild(lockedRow);

      const unlockBtn = document.createElement("button");
      unlockBtn.textContent = "Unlock";
      unlockBtn.dataset.uid = docSnap.id;
      unlockBtn.className = "unlock-btn";
      div.appendChild(unlockBtn);
      div.appendChild(document.createElement("hr"));

      container.appendChild(div);
    });

    document.querySelectorAll(".unlock-btn").forEach(btn => {
      btn.onclick = async () => {
        const uid = btn.dataset.uid;
        await updateDoc(doc(db, "users", uid), {
          locked: false
        });
        alert("Username unlocked.");
        loadUsers();
      };
    });
  }

  async function loadUsernames() {
    const snap = await getDocs(collection(db, "usernames"));
    const container = document.getElementById("username-list");
    container.innerHTML = "";

    snap.forEach((docSnap) => {
      const data = docSnap.data();
      const div = document.createElement("div");

      const usernameEl = document.createElement("strong");
      usernameEl.textContent = docSnap.id;
      div.appendChild(usernameEl);
      div.appendChild(document.createTextNode(" → " + data.uid));

      const deleteBtn = document.createElement("button");
      deleteBtn.textContent = "Delete";
      deleteBtn.dataset.name = docSnap.id;
      deleteBtn.className = "delete-username";
      div.appendChild(deleteBtn);
      div.appendChild(document.createElement("hr"));

      container.appendChild(div);
    });

    document.querySelectorAll(".delete-username").forEach(btn => {
      btn.onclick = async () => {
        const name = btn.dataset.name;
        await deleteDoc(doc(db, "usernames", name));
        alert("Username reservation deleted.");
        loadUsernames();
      };
    });
  }
</script>

</body>
</html>
